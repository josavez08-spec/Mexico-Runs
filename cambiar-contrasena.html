<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Actualizar contraseña · Mexico Runs</title><link rel="stylesheet" href="css/styles.css"></head><body>
<header><nav class="navbar"><a href="index.html" class="brand"><span class="brand-badge">MR</span> Mexico Runs</a></nav></header>
<main><section class="card-form"><p class="hero-tag">Seguridad de tu cuenta</p><h1>Actualiza tu contraseña</h1><p>Para continuar, crea una contraseña con al menos 8 caracteres, una letra, un número y un carácter especial.</p><form id="changeForm"><div class="form-group"><label for="password">Nueva contraseña</label><input id="password" name="password" type="password" minlength="8" pattern="(?=.*[A-Za-zÁÉÍÓÚáéíóúÑñ])(?=.*\d)(?=.*[^A-Za-z0-9ÁÉÍÓÚáéíóúÑñ]).{8,}" required autocomplete="new-password"></div><div class="form-group"><label for="again">Repite la contraseña</label><input id="again" type="password" minlength="8" required autocomplete="new-password"></div><p id="message" role="status"></p><button class="btn-primary" type="submit">Guardar contraseña</button></form></section></main>
<script>const form=document.getElementById('changeForm'),message=document.getElementById('message');form.onsubmit=async e=>{e.preventDefault();if(form.password.value!==document.getElementById('again').value){message.textContent='Las contraseñas no coinciden.';return}try{const r=await fetch('/api/cambiar-contrasena',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:form.password.value})});const d=await r.json();if(!r.ok)throw Error(d.message);location.href='index.html'}catch(x){message.textContent=x.message}};</script></body></html>
