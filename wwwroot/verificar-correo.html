<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verificar correo · Mexico Runs</title><link rel="stylesheet" href="css/styles.css"></head><body><main class="results-page"><section class="card"><h1 class="card-title">Verificación de correo</h1><p id="message" role="status">Verificando enlace…</p><a class="btn-primary" href="login.html">Volver a Mexico Runs</a></section></main><script>(async()=>{const m=document.getElementById('message'),token=new URLSearchParams(location.search).get('token');if(!token){m.textContent='No se encontró el token del enlace.';return}try{const r=await fetch('/api/email-verificacion/confirmar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})}),d=await r.json();if(!r.ok)throw Error(d.message);m.textContent=d.message}catch(e){m.textContent=e.message}})();</script></body></html>
