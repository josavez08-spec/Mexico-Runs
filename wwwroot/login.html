<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Iniciar sesión - Mexico Runs</title><link rel="stylesheet" href="css/styles.css"></head>
<body><header><nav class="navbar"><a href="index.html" class="brand"><span class="brand-badge">MR</span> Mexico Runs</a><ul class="nav-links"><li><a href="index.html">Inicio</a></li><li><a href="catalago.html">Catálogo</a></li><li><a href="reservaciones.html">Reservaciones</a></li><li><a href="nosotros.html">Nosotros</a></li></ul><div class="auth-buttons"><a href="registro.html" class="btn-primary">Crear cuenta</a></div></nav></header>
<main><div class="card" style="max-width:460px;margin:0 auto"><h1 class="card-title">Iniciar sesión</h1><p class="card-subtitle">Elige el tipo de cuenta que corresponde a tu correo y contraseña.</p><form id="loginForm" style="margin-top:20px"><div class="form-group"><label for="rol">Tipo de cuenta</label><select id="rol" name="rol" required><option value="Cliente">Cliente</option><option value="Empleado">Empleado</option><option value="Administrador">Administrador</option></select></div><div class="form-group"><label for="correo">Correo</label><input type="email" id="correo" name="correo" autocomplete="username" required></div><div class="form-group"><label for="password">Contraseña</label><div style="display:flex;gap:8px"><input type="password" id="password" name="password" autocomplete="current-password" required style="flex:1"><button type="button" id="togglePassword" class="btn-link" aria-pressed="false">Mostrar</button></div></div><p id="mensaje" role="status" aria-live="polite"></p><button class="btn-primary" type="submit" style="width:100%;margin-top:10px;padding:10px">Entrar</button></form><p class="form-footer" style="text-align:center;margin-top:15px">¿Aún no tienes cuenta? <a href="registro.html">Crea una aquí</a>.</p></div></main>
<footer><div class="footer-content"><p>Mexico Runs · Proyecto escolar con pagos de demostración.</p></div></footer>
<script>
const f=document.getElementById('loginForm'),m=document.getElementById('mensaje');
document.getElementById('togglePassword').addEventListener('click',function(){const p=document.getElementById('password'),shown=p.type==='password';p.type=shown?'text':'password';this.textContent=shown?'Ocultar':'Mostrar';this.setAttribute('aria-pressed',String(shown))});
f.addEventListener('submit',async e=>{e.preventDefault();m.textContent='';try{const r=await fetch('/api/login',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))});const d=await r.json();if(!r.ok)throw Error(d.message);location.href=d.user.mustChange?'cambiar-contrasena.html':d.user.rol==='Administrador'?'admin.html':d.user.rol==='Empleado'?'operacion.html':'index.html'}catch(e){m.textContent=e.message==='Failed to fetch'?'No se pudo contactar al servidor. Inicia node server.js.':e.message}});
</script></body></html>
